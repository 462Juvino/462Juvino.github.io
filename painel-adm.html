<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel ADM - RDM Studio</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .modal-jogos { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 2000; }
        .modal-jogos-box { background: var(--card-bg); padding: 30px; border-radius: 15px; width: 90%; max-width: 450px; border: 2px solid var(--destaque); text-align: left; }
        .game-checkbox { margin-bottom: 10px; font-size: 1rem; color: white; display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.05); padding: 8px; border-radius: 8px; }
        .game-checkbox input { width: 18px; height: 18px; cursor: pointer; }
        .game-checkbox:hover { background: rgba(255,255,255,0.1); }

        .action-btn { border: none; padding: 8px 12px; border-radius: 5px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 0.85rem; }
        .action-btn:hover { filter: brightness(1.2); transform: scale(1.05); }
    </style>
</head>
<body class="theme-painel" style="--bg-color: #0f172a; --card-bg: #1e293b; --destaque: #facc15; --hover-destaque: #eab308;">
    <header style="padding: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--destaque);">
        <a href="index.html" class="btn-voltar">⬅ VOLTAR AO SITE</a>
        <h1 style="color: var(--destaque); margin: 0;">👑 CENTRAL DE COMANDO ADM</h1>
        <div id="adm-logged-info" style="color: white; font-weight: bold;"></div>
    </header>

    <main style="padding: 40px 20px; text-align: center; max-width: 1200px; margin: auto;">
        <div style="background: var(--card-bg); padding: 30px; border-radius: 15px; border: 1px solid #334155;">
            <h2 style="margin-top: 0; color: white; margin-bottom: 20px;">Gerenciamento de Assinaturas e Licenças</h2>

            <!-- LUPA E FILTROS -->
            <div style="display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap;">
                <input type="text" id="search-user" placeholder="🔍 Pesquisar por @usuário..." style="flex: 2; padding: 12px; border-radius: 8px; background: #0f172a; color: white; border: 1px solid #334155; font-size: 1rem; outline: none;" onkeyup="filtrarTabela()">
                <select id="filter-plan" style="flex: 1; padding: 12px; border-radius: 8px; background: #0f172a; color: white; border: 1px solid #334155; font-size: 1rem; outline: none;" onchange="filtrarTabela()">
                    <option value="todos">Todos os Planos</option>
                    <option value="gratuito">Gratuito</option>
                    <option value="plus">Plus</option>
                    <option value="plus premium">Plus Premium</option>
                    <option value="pro">Pro</option>
                    <option value="adm">ADM</option>
                </select>
            </div>

            <div style="overflow-x: auto;">
                <table style="width: 100%; border-collapse: collapse; text-align: left; color: white;">
                    <thead>
                        <tr style="background-color: #0f172a; border-bottom: 2px solid var(--destaque);">
                            <th style="padding: 15px;">Usuário (@)</th>
                            <th style="padding: 15px;">Hierarquia e Tempo</th>
                            <th style="padding: 15px; text-align: center;">Ações do Painel</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-usuarios">
                        <tr><td colspan="3" style="text-align: center; padding: 20px;">Carregando usuários do Firebase...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- MODAL DE JOGOS DINÂMICO -->
    <div id="modal-gerenciar-jogos" class="modal-jogos">
        <div class="modal-jogos-box">
            <h2 style="color: var(--destaque); margin-top: 0; text-align: center;">Liberar Jogos Extras</h2>
            <p id="nome-user-modal" style="color: #94a3b8; margin-bottom: 15px; text-align: center; font-weight: bold; font-size: 1.1rem;"></p>
            <input type="hidden" id="modal-userid">

            <!-- AQUI O JAVASCRIPT INJETA OS JOGOS AUTOMATICAMENTE -->
            <div id="lista-jogos-dinamica" style="max-height: 400px; overflow-y: auto; padding-right: 5px;"></div>

            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button onclick="salvarJogos()" style="flex: 1; padding: 12px; background: #22c55e; color: black; font-weight: bold; border: none; border-radius: 8px; cursor: pointer;">Salvar Acessos</button>
                <button onclick="fecharModalJogos()" style="flex: 1; padding: 12px; background: #ef4444; color: white; font-weight: bold; border: none; border-radius: 8px; cursor: pointer;">Cancelar</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, get, update, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB2LNWktWEwYLuZxwr8oc9NpcjFz3GU5qc",
            authDomain: "authrdm-a82a6.firebaseapp.com",
            databaseURL: "https://authrdm-a82a6-default-rtdb.firebaseio.com",
            projectId: "authrdm-a82a6",
            storageBucket: "authrdm-a82a6.firebasestorage.app",
            messagingSenderId: "97459319845",
            appId: "1:97459319845:web:8e1a16bbb6269af3b5fbcc"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        const perfil = localStorage.getItem("rdm_perfil");
        const logado = localStorage.getItem("rdm_user");

        if (perfil !== "adm") {
            window.location.href = "index.html";
        } else {
            document.getElementById("adm-logged-info").innerText = `Logado como ADM: @${logado}`;
            carregarUsuarios();
        }

        // ========================================================
        // 🎮 CATÁLOGO INTELIGENTE DE JOGOS
        // Para adicionar um jogo novo no site, é só colocar aqui!
        // ========================================================
        const catalogoDeJogos = [
            { id: "bomba_bomba", nome: "🔥 BomBa BomBa" },
            { id: "daaz", nome: "🎲 DAAZ" },
            { id: "politicos", nome: "👔 POLITICOS" },
            { id: "roblox", nome: "💃 Roblox Dance" },
            { id: "x1", nome: "⚔️ Arena X1" },
            { id: "estope", nome: "🛑 ESTOPE" },
            { id: "war", nome: "🗺️ War: Estados Brasileiros" },
            { id: "fc", nome: "⚽ RDM FC" },
            { id: "stickman", nome: "🧍 Stickman Chaos" },
            { id: "kof", nome: "🕹️ KOF TikTok" },
            { id: "snake", nome: "🐍 Snake Battle" },
            { id: "pro_arena", nome: "🎮 PRO Arena" },
            { id: "brain", nome: "🧠 BrainBom & Anagrama" },
            { id: "milhao", nome: "💰 Show do Milhão Live" },
            { id: "host", nome: "🎙️ Painel Host + Narrador" } // Ferramenta entra aqui tbm
        ];

        // 1. CARREGAR E RENDERIZAR USUÁRIOS
        async function carregarUsuarios() {
            const tabela = document.getElementById("tabela-usuarios");
            const usersRef = ref(database, 'usuarios');

            try {
                const snapshot = await get(usersRef);
                if (snapshot.exists()) {
                    tabela.innerHTML = "";
                    const usuarios = snapshot.val();

                    // Puxa as chaves e ordena alfabeticamente para ficar organizado
                    const chavesOrdenadas = Object.keys(usuarios).sort((a, b) => a.localeCompare(b));

                    chavesOrdenadas.forEach(key => {
                        const user = usuarios[key];
                        let vencimento = "Vitalício/Gratuito";
                        if (user.expiracao) {
                            const dataExp = new Date(user.expiracao);
                            if (dataExp.getTime() < new Date().getTime()) {
                                vencimento = `<span style="color:#ef4444;">Expirado em ${dataExp.toLocaleDateString('pt-BR')}</span>`;
                            } else {
                                vencimento = `<span style="color:#22c55e;">Vence em ${dataExp.toLocaleDateString('pt-BR')}</span>`;
                            }
                        }

                        const selectPerfil = `
                            <select id="perfil-${key}" style="padding: 8px; border-radius: 5px; background: #0f172a; color: white; border: 1px solid #334155; font-weight: bold;">
                                <option value="gratuito" ${user.perfil === 'gratuito' ? 'selected' : ''}>Gratuito</option>
                                <option value="plus" ${user.perfil === 'plus' ? 'selected' : ''}>Plus</option>
                                <option value="plus premium" ${user.perfil === 'plus premium' ? 'selected' : ''}>Plus Premium</option>
                                <option value="pro" ${user.perfil === 'pro' ? 'selected' : ''}>Pro</option>
                                <option value="adm" ${user.perfil === 'adm' ? 'selected' : ''}>ADM</option>
                            </select>
                        `;

                        tabela.innerHTML += `
                            <tr class="user-row" data-user="${user.usuario}" data-plan="${user.perfil}" style="border-bottom: 1px solid #334155;">
                                <td style="padding: 15px; font-weight: bold; color: #38bdf8; font-size: 1.1rem;">
                                    @${user.usuario}<br>
                                    <span style="font-size:0.8rem; color:#94a3b8; font-weight:normal;">Senha: ${user.chave}</span><br>
                                    <span style="font-size:0.85rem; font-weight:normal;">${vencimento}</span>
                                </td>
                                <td style="padding: 15px;">
                                    <div style="display: flex; gap: 10px; align-items: center;">
                                        ${selectPerfil}
                                        <input type="number" id="meses-${key}" value="1" min="1" style="width: 70px; padding: 8px; border-radius: 5px; background: #0f172a; color: white; border: 1px solid #334155;" title="Soma meses na assinatura">
                                        <span style="color:#94a3b8; font-size: 0.9rem;">Mes(es)</span>
                                    </div>
                                </td>
                                <td style="padding: 15px;">
                                    <div style="display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;">
                                        <button class="action-btn" onclick="salvarAlteracao('${key}')" style="background: var(--destaque); color: black;">💾 Salvar Plano</button>
                                        <button class="action-btn" onclick="abrirModalJogos('${key}')" style="background: #3b82f6; color: white;">🎮 Jogos Ext.</button>
                                        <button class="action-btn" onclick="trocarSenha('${key}')" style="background: #8b5cf6; color: white;">🔑 Senha</button>
                                        <button class="action-btn" onclick="excluirConta('${key}')" style="background: #ef4444; color: white;">🗑️ Excluir</button>
                                    </div>
                                </td>
                            </tr>
                        `;
                    });
                }
            } catch (error) {
                console.error(error);
            }
        }

        // 2. FILTRAR TABELA (LUPAS)
        window.filtrarTabela = function() {
            const searchVal = document.getElementById("search-user").value.toLowerCase();
            const planVal = document.getElementById("filter-plan").value.toLowerCase();
            const rows = document.querySelectorAll(".user-row");

            rows.forEach(row => {
                const userText = row.getAttribute("data-user").toLowerCase();
                const planText = row.getAttribute("data-plan").toLowerCase();

                const matchUser = userText.includes(searchVal);
                const matchPlan = planVal === "todos" || planText === planVal;

                if (matchUser && matchPlan) {
                    row.style.display = "";
                } else {
                    row.style.display = "none";
                }
            });
        };

        // 3. SALVAR PLANO COM IA PARA ABRIR JOGOS
        window.salvarAlteracao = async function(userId) {
            const novoPerfil = document.getElementById(`perfil-${userId}`).value;
            const meses = parseInt(document.getElementById(`meses-${userId}`).value) || 1;
            const userRef = ref(database, 'usuarios/' + userId);

            let dadosAtualizados = { perfil: novoPerfil };

            if (novoPerfil === 'plus' || novoPerfil === 'plus premium' || novoPerfil === 'pro') {
                const snapUser = await get(userRef);
                let expiracaoAtual = snapUser.exists() ? snapUser.val().expiracao : null;
                let dataBase = new Date();
                // Se ainda for válido, soma a partir do vencimento. Se tiver vencido, soma a partir de hoje.
                if (expiracaoAtual && expiracaoAtual > Date.now()) {
                    dataBase = new Date(expiracaoAtual);
                }
                dataBase.setMonth(dataBase.getMonth() + meses);
                dadosAtualizados.expiracao = dataBase.getTime();
            } else {
                dadosAtualizados.expiracao = null;
            }

            try {
                await update(userRef, dadosAtualizados);
                alert(`Licença de @${userId} atualizada para [ ${novoPerfil.toUpperCase()} ]!`);

                // Recarrega a tabela no fundo suavemente
                carregarUsuarios();

                // 🧠 INTELIGÊNCIA: Se o plano precisa de jogos manuais, já abre o modal na cara do ADM!
                if (novoPerfil === 'plus' || novoPerfil === 'plus premium') {
                    abrirModalJogos(userId);
                }
            } catch (error) {
                alert("Erro ao salvar no Firebase.");
            }
        };

        // 4. TROCAR SENHA
        window.trocarSenha = async function(userId) {
            const novaSenha = prompt(`Digite a NOVA SENHA para @${userId}:`);
            if (novaSenha && novaSenha.trim() !== "") {
                try {
                    await update(ref(database, 'usuarios/' + userId), { chave: novaSenha.trim() });
                    alert(`Senha de @${userId} alterada com sucesso!`);
                    carregarUsuarios();
                } catch (e) {
                    alert("Erro ao trocar a senha.");
                }
            }
        };

        // 5. EXCLUIR CONTA
        window.excluirConta = async function(userId) {
            const confirmacao = confirm(`⚠️ PERIGO: Tem certeza que quer EXCLUIR a conta de @${userId} para sempre? Esta ação não pode ser desfeita.`);
            if (confirmacao) {
                try {
                    await remove(ref(database, 'usuarios/' + userId));
                    alert(`A conta @${userId} foi evaporada do servidor!`);
                    carregarUsuarios();
                } catch (e) {
                    alert("Erro ao excluir conta.");
                }
            }
        };

        // 6. GESTÃO DOS JOGOS LIBERADOS
        window.abrirModalJogos = async function(userId) {
            document.getElementById('modal-userid').value = userId;
            document.getElementById('nome-user-modal').innerText = "Jogos permitidos para: @" + userId;

            // Injeta o catálogo atualizado no HTML
            const containerJogos = document.getElementById('lista-jogos-dinamica');
            containerJogos.innerHTML = "";
            catalogoDeJogos.forEach(jogo => {
                containerJogos.innerHTML += `
                    <label class="game-checkbox">
                        <input type="checkbox" id="check-${jogo.id}"> ${jogo.nome}
                    </label>
                `;
            });

            // Puxa as marcações salvas no banco e marca as caixinhas
            const jogosRef = ref(database, 'usuarios/' + userId + '/jogos');
            const snapshot = await get(jogosRef);

            if (snapshot.exists()) {
                const jogosAprovados = snapshot.val();
                catalogoDeJogos.forEach(jogo => {
                    if(jogosAprovados[jogo.id] === true) {
                        document.getElementById(`check-${jogo.id}`).checked = true;
                    }
                });
            }
            document.getElementById('modal-gerenciar-jogos').style.display = 'flex';
        };

        window.fecharModalJogos = function() {
            document.getElementById('modal-gerenciar-jogos').style.display = 'none';
        };

        window.salvarJogos = async function() {
            const userId = document.getElementById('modal-userid').value;
            const jogosRef = ref(database, 'usuarios/' + userId + '/jogos');

            let dadosJogos = {};
            catalogoDeJogos.forEach(jogo => {
                dadosJogos[jogo.id] = document.getElementById(`check-${jogo.id}`).checked;
            });

            try {
                await update(jogosRef, dadosJogos);
                alert("Acessos do portfólio salvos com sucesso!");
                fecharModalJogos();
            } catch (err) {
                alert("Erro ao salvar os jogos permitidos.");
            }
        };
    </script>
</body>
</html>
